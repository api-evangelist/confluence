note: 'Binds each published Confluence tool on the Atlassian Rovo MCP Server to the REST operationId(s) that back
  it. The live MCP schema is OAuth-gated (tools/list returns 401), so rows are mapped by the provider''s own published
  tool names and descriptions against the operationIds in the harvested v1 and v2 specs, and confidence is recorded
  honestly rather than asserted. Nothing here was invented: every operationId appears in a spec in openapi/ and
  every tool appears in the provider''s Supported tools reference.'
