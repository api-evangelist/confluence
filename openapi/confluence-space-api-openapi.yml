openapi: 3.2.0
info:
  title: Confluence Space API
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Space across 3 of this provider''s published API definitions: confluence-cloud-v2.yml, confluence-rest-v1-openapi.json, confluence-rest-v2-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{domain}.atlassian.net/wiki/api/v2
  description: Confluence Cloud
  variables:
    domain:
      default: your-domain
      description: Your Atlassian Cloud site domain
- url: //your-domain.atlassian.net
- url: https://{your-domain}/wiki/api/v2
  variables:
    your-domain:
      default: no-default
      description: Specific domain of the Confluence site being used. Must be provided.
tags:
- name: Space
  description: Retrieve and manage Confluence spaces
  externalDocs:
    url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-space/
paths:
  /spaces:
    get:
      operationId: getSpaces
      summary: Get Spaces
      description: Returns all spaces. The results can be filtered by space type, status, and labels. Pagination is cursor-based.
      tags:
      - Space
      parameters:
      - name: ids
        in: query
        description: Filter by space IDs. Multiple IDs can be specified as comma-separated values.
        schema:
          type: array
          items:
            type: integer
            format: int64
        example: []
      - name: keys
        in: query
        description: Filter by space keys. Multiple keys can be specified as comma-separated values.
        schema:
          type: array
          items:
            type: string
        example: []
      - name: type
        in: query
        description: Filter by space type.
        schema:
          type: string
          enum:
          - global
          - personal
        example: global
      - name: status
        in: query
        description: Filter by space status.
        schema:
          type: string
          enum:
          - current
          - archived
        example: current
      - name: labels
        in: query
        description: Filter by space labels. Multiple labels can be specified.
        schema:
          type: array
          items:
            type: string
        example: []
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/DescriptionFormatParam'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Returned if the requested spaces are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpaceBulk'
              examples:
                Getspaces200Example:
                  summary: Default getSpaces 200 response
                  x-microcks-default: true
                  value:
                    results:
                    - id: abc123
                      key: example_value
                      name: Example Title
                      type: global
                      status: current
                      authorId: '500123'
                      createdAt: '2026-01-15T10:30:00Z'
                      homepageId: '500123'
                    _links:
                      next: example_value
                      base: example_value
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oAuth2: []
      - bearerAuth: []
    post:
      tags:
      - Space
      operationId: createSpace
      summary: Create space
      description: 'Creates a Space as specified in the payload.


        Available on tenants with Role-Based Access Control.


        **Permissions required**:

        Permission to create spaces.'
      requestBody:
        $ref: '#/components/requestBodies/SpaceCreateRequest'
      responses:
        '201':
          description: Returned if the requested space is created.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SpaceBulk_2'
                - type: object
                  properties:
                    _links:
                      type: object
                      properties:
                        base:
                          type: string
                          description: Base url of the Confluence site.
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: Returned if the calling user does not have permission to create spaces.
          content: {}
        '413':
          description: Returned if the request is too large in size (over 5 MB).
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:space:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:space:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-atlassian-connect-scope: WRITE
    servers:
    - url: https://{domain}.atlassian.net/wiki/api/v2
      description: Confluence Cloud
      variables:
        domain:
          default: your-domain
          description: Your Atlassian Cloud site domain
  /spaces/{id}:
    get:
      operationId: getSpaceById
      summary: Get Space by Id
      description: Returns a specific space by its id.
      tags:
      - Space
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the space.
        schema:
          type: integer
          format: int64
        example: abc123
      - $ref: '#/components/parameters/DescriptionFormatParam'
      responses:
        '200':
          description: Returned if the requested space is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space'
              examples:
                Getspacebyid200Example:
                  summary: Default getSpaceById 200 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    key: example_value
                    name: Example Title
                    type: global
                    status: current
                    authorId: '500123'
                    createdAt: '2026-01-15T10:30:00Z'
                    homepageId: '500123'
                    description: {}
                    icon:
                      path: example_value
                      apiDownloadLink: example_value
                    labels:
                      results:
                      - {}
                    properties:
                      results:
                      - {}
                    operations:
                      results:
                      - {}
                    permissions:
                      results:
                      - {}
                    _links:
                      webui: example_value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oAuth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/wiki/api/v2
      description: Confluence Cloud
      variables:
        domain:
          default: your-domain
          description: Your Atlassian Cloud site domain
  /spaces/{id}/pages:
    get:
      operationId: getPagesInSpace
      summary: Get Pages in Space
      description: Returns all pages in a specific space. Supports filtering by status and depth.
      tags:
      - Space
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the space.
        schema:
          type: integer
          format: int64
        example: abc123
      - name: depth
        in: query
        description: Filter by depth in the page tree. Use root to get only top-level pages.
        schema:
          type: string
          enum:
          - all
          - root
        example: all
      - $ref: '#/components/parameters/StatusFilter'
      - $ref: '#/components/parameters/BodyFormatParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Returned if the pages in the space are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageBulk'
              examples:
                Getpagesinspace200Example:
                  summary: Default getPagesInSpace 200 response
                  x-microcks-default: true
                  value:
                    results:
                    - id: abc123
                      status: current
                      title: Example Title
                      spaceId: '500123'
                      parentId: '500123'
                      parentType: page
                      position: 10
                      authorId: '500123'
                      ownerId: '500123'
                      lastOwnerId: '500123'
                      createdAt: '2026-01-15T10:30:00Z'
                    _links:
                      next: example_value
                      base: example_value
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oAuth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/wiki/api/v2
      description: Confluence Cloud
      variables:
        domain:
          default: your-domain
          description: Your Atlassian Cloud site domain
  /wiki/rest/api/space:
    post:
      tags:
      - Space
      summary: Create space
      description: 'Creates a new space. Note, currently you cannot set space labels when

        creating a space.


        **Permissions required**:

        ''Create Space(s)'' global permission.'
      operationId: createSpace
      requestBody:
        description: The space to be created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceCreate'
        required: true
      responses:
        '200':
          description: Returned if the space is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space_2'
        '400':
          description: 'Returned if any of the following is true:


            - The request is invalid.

            - The space already exists.'
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '403':
          description: Returned if the callig user does not have permission to create a space.
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:confluence-space
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:confluence-space
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - read:space-details:confluence
        - write:space:confluence
        - write:space.permission:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-codegen-request-body-name: body
      x-atlassian-connect-scope: WRITE
    servers:
    - url: //your-domain.atlassian.net
  /wiki/rest/api/space/_private:
    post:
      tags:
      - Space
      summary: Create private space
      description: 'Creates a new space that is only visible to the creator. This method is

        the same as the Create space method with permissions

        set to the current user only. Note, currently you cannot set space

        labels when creating a space.


        **Permissions required**:

        ''Create Space(s)'' global permission.'
      operationId: createPrivateSpace
      requestBody:
        description: The space to be created.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceCreate'
        required: true
      responses:
        '200':
          description: Returned if the space is created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space_2'
        '400':
          description: 'Returned if any of the following is true:


            - The request is invalid.

            - The space already exists.'
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '403':
          description: Returned if the user does not have permission to create a space.
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:confluence-space
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:confluence-space
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - read:space-details:confluence
        - write:space:confluence
        - write:space.permission:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-codegen-request-body-name: SpacePrivateCreate
      x-atlassian-connect-scope: WRITE
    servers:
    - url: //your-domain.atlassian.net
  /wiki/rest/api/space/{spaceKey}:
    put:
      tags:
      - Space
      summary: Update space
      description: 'Updates the name, description, or homepage of a space.


        - For security reasons, permissions cannot be updated via the API and

        must be changed via the user interface instead.

        - Currently you cannot set space labels when updating a space.


        **Permissions required**:

        ''Admin'' permission for the space.'
      operationId: updateSpace
      parameters:
      - name: spaceKey
        in: path
        description: The key of the space to update.
        required: true
        schema:
          type: string
      requestBody:
        description: The updated space.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpaceUpdate'
        required: true
      responses:
        '200':
          description: Returned if the space is updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Space_2'
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if any of the following is true:


            - There is no space with the given key

            - The calling user does not have permission to update the space.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:confluence-space
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:confluence-space
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - read:space-details:confluence
        - write:space:confluence
        - write:space.permission:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: true
      x-codegen-request-body-name: body
      x-atlassian-connect-scope: WRITE
    delete:
      tags:
      - Space
      summary: Delete space
      description: 'Permanently deletes a space without sending it to the trash. Note, the space will be deleted in a long running task.

        Therefore, the space may not be deleted yet when this method has

        returned. Clients should poll the status link that is returned in the

        response until the task completes.


        **Permissions required**:

        ''Admin'' permission for the space.'
      operationId: deleteSpace
      parameters:
      - name: spaceKey
        in: path
        description: The key of the space to delete.
        required: true
        schema:
          type: string
      responses:
        '202':
          description: Returns a pointer to the status of the space deletion task.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LongTask'
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if any of the following is true:


            - There is no space with the given key.

            - The calling user does not have permission to delete the space.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:confluence-space
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:confluence-space
      - scheme: oAuthDefinitions
        state: Beta
        scopes:
        - read:content.metadata:confluence
        - delete:space:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: DELETE
    servers:
    - url: //your-domain.atlassian.net
components:
  schemas:
    Error:
      type: object
      description: Error response from the Confluence API.
      properties:
        statusCode:
          type: integer
          description: The HTTP status code.
          example: 10
        data:
          type: object
          properties:
            authorized:
              type: boolean
            valid:
              type: boolean
            errors:
              type: array
              items:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      key:
                        type: string
                      args:
                        type: array
                        items:
                          type: string
                      translation:
                        type: string
            successful:
              type: boolean
          description: Details about the error.
          example: example_value
        message:
          type: string
          description: A human-readable error message.
          example: example_value
    BodyRepresentation:
      type: object
      properties:
        representation:
          type: string
          description: The name of the representation format.
          example: example_value
        value:
          type: string
          description: The body content in this representation.
          example: example_value
    OperationArray:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Operation'
          example: []
    Like:
      type: object
      properties:
        accountId:
          type: string
          description: The Atlassian account ID of the user who liked the content.
          example: '500123'
    SpaceLinks:
      type: object
      properties:
        webui:
          type: string
          description: Web UI link for the space.
          example: example_value
    LabelArray:
      type: object
      description: A list of labels.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Label'
          example: []
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    Version:
      type: object
      description: Version information for content.
      properties:
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp of this version.
          example: '2026-01-15T10:30:00Z'
        message:
          type: string
          description: The message associated with this version.
          example: example_value
        number:
          type: integer
          description: The version number.
          example: 10
        minorEdit:
          type: boolean
          description: Whether this was a minor edit.
          example: true
        authorId:
          type: string
          description: The Atlassian account ID of the version author.
          example: '500123'
    Space:
      type: object
      description: Represents a Confluence space.
      properties:
        id:
          type: string
          description: The unique identifier of the space.
          example: abc123
        key:
          type: string
          description: The key of the space, used in URLs.
          example: example_value
        name:
          type: string
          description: The name of the space.
          example: Example Title
        type:
          type: string
          description: The type of space.
          enum:
          - global
          - personal
          example: global
        status:
          type: string
          description: The status of the space.
          enum:
          - current
          - archived
          example: current
        authorId:
          type: string
          description: The Atlassian account ID of the space creator.
          example: '500123'
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp when the space was created.
          example: '2026-01-15T10:30:00Z'
        homepageId:
          type: string
          description: The ID of the space homepage.
          example: '500123'
        description:
          $ref: '#/components/schemas/SpaceDescription'
        icon:
          $ref: '#/components/schemas/SpaceIcon'
        labels:
          $ref: '#/components/schemas/LabelArray'
        properties:
          $ref: '#/components/schemas/SpacePropertyArray'
        operations:
          $ref: '#/components/schemas/OperationArray'
        permissions:
          $ref: '#/components/schemas/SpacePermissionArray'
        _links:
          $ref: '#/components/schemas/SpaceLinks'
    Operation:
      type: object
      properties:
        operation:
          type: string
          description: The operation type.
          enum:
          - create
          - read
          - update
          - delete
          - administer
          example: create
        targetType:
          type: string
          description: The target type for the operation.
          example: example_value
    PageBulk:
      type: object
      description: A paginated list of pages.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Page'
          example: []
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    LikeArray:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Like'
          example: []
    SpaceDescription:
      type: object
      properties:
        plain:
          $ref: '#/components/schemas/BodyRepresentation'
        view:
          $ref: '#/components/schemas/BodyRepresentation'
    SpaceBulk:
      type: object
      description: A paginated list of spaces.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Space'
          example: []
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    Page:
      type: object
      description: Represents a Confluence page.
      properties:
        id:
          type: string
          description: The unique identifier of the page.
          example: abc123
        status:
          type: string
          description: The current status of the page.
          enum:
          - current
          - draft
          - archived
          - trashed
          example: current
        title:
          type: string
          description: The title of the page.
          example: Example Title
        spaceId:
          type: string
          description: The ID of the space this page belongs to.
          example: '500123'
        parentId:
          type: string
          description: The ID of the parent page, if the page is nested.
          example: '500123'
        parentType:
          type: string
          description: The type of the parent (page or space).
          enum:
          - page
          - space
          example: page
        position:
          type: integer
          description: The position of this page in the page tree relative to siblings.
          example: 10
        authorId:
          type: string
          description: The Atlassian account ID of the page author.
          example: '500123'
        ownerId:
          type: string
          description: The Atlassian account ID of the page owner.
          example: '500123'
        lastOwnerId:
          type: string
          description: The Atlassian account ID of the previous owner.
          example: '500123'
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp when the page was created.
          example: '2026-01-15T10:30:00Z'
        version:
          $ref: '#/components/schemas/Version'
        body:
          $ref: '#/components/schemas/Body'
        labels:
          $ref: '#/components/schemas/LabelArray'
        properties:
          $ref: '#/components/schemas/ContentPropertyArray'
        operations:
          $ref: '#/components/schemas/OperationArray'
        likes:
          $ref: '#/components/schemas/LikeArray'
        versions:
          $ref: '#/components/schemas/VersionArray'
        _links:
          $ref: '#/components/schemas/PageLinks'
    SpacePermissionArray:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/SpacePermission'
          example: []
    Label:
      type: object
      description: Represents a label applied to Confluence content.
      properties:
        id:
          type: string
          description: The unique identifier of the label.
          example: abc123
        name:
          type: string
          description: The name of the label.
          example: Example Title
        prefix:
          type: string
          description: The prefix of the label (global, my, team).
          example: example_value
    SpacePermission:
      type: object
      properties:
        id:
          type: string
          example: abc123
        principal:
          type: object
          properties:
            type:
              type: string
              enum:
              - user
              - group
              - role
            id:
              type: string
          example: example_value
        operation:
          $ref: '#/components/schemas/Operation'
    SpacePropertyArray:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ContentProperty'
          example: []
    PaginationLinks:
      type: object
      description: Pagination links for cursor-based pagination.
      properties:
        next:
          type: string
          description: URL for the next page of results. Contains the cursor parameter.
          example: example_value
        base:
          type: string
          description: The base URL of the Confluence instance.
          example: example_value
    ContentPropertyArray:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/ContentProperty'
          example: []
    Body:
      type: object
      description: The body content in various representations.
      properties:
        storage:
          $ref: '#/components/schemas/BodyRepresentation'
        atlas_doc_format:
          $ref: '#/components/schemas/BodyRepresentation'
        view:
          $ref: '#/components/schemas/BodyRepresentation'
    VersionArray:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Version'
          example: []
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    PageLinks:
      type: object
      properties:
        webui:
          type: string
          description: Web UI link for the page.
          example: example_value
        editui:
          type: string
          description: Edit UI link for the page.
          example: example_value
        tinyui:
          type: string
          description: Shortened link for the page.
          example: example_value
    SpaceIcon:
      type: object
      properties:
        path:
          type: string
