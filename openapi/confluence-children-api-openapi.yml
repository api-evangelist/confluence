openapi: 3.2.0
info:
  title: Confluence Cloud REST API v2 Children API
  description: This document describes Confluence's v2 APIs. This is intended to be an iteration on the existing Confluence Cloud REST API with improvements in both endpoint definitions and performance.
  termsOfService: https://developer.atlassian.com/platform/marketplace/atlassian-developer-terms/
  version: 2.0.0
servers:
- url: https://{your-domain}/wiki/api/v2
  variables:
    your-domain:
      default: no-default
      description: Specific domain of the Confluence site being used. Must be provided.
tags:
- name: Children
  description: ''
paths:
  /whiteboards/{id}/direct-children:
    get:
      tags:
      - Children
      operationId: getWhiteboardDirectChildren
      summary: Get direct children of a whiteboard
      description: 'Returns all children for given whiteboard id in the content tree. The number of results is limited by the `limit` parameter and additional results (if available)

        will be available through the `next` URL present in the `Link` response header.


        The following types of content will be returned:

        - Database

        - Embed

        - Folder

        - Page

        - Whiteboard


        This endpoint returns minimal information about each child. To fetch more details, use a related endpoint based on the content type, such

        as:


        - Get database by id

        - Get embed by id

        - Get folder by id

        - Get page by id

        - Get whiteboard by id.


        **Permissions required**:

        Permission to access the Confluence site (''Can use'' global permission).

        Only content that the user has permission to view will be returned.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the parent whiteboard.
        schema:
          format: int64
          type: integer
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set of results.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of items per result to return. If more results exist, use the `Link` header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 25
          minimum: 1
          maximum: 250
          type: integer
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          type: string
          items:
            $ref: '#/components/schemas/ContentSortOrder'
      responses:
        '200':
          description: Returned if the requested children are returned.
          content:
            application/json:
              schema:
                title: MultiEntityResult<ChildrenResponse>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChildrenResponse'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: 'This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request''s URL. Example response header format: <https://site.atlassian.net/wiki>; rel="base"`

                '
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:hierarchical-content:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:hierarchical-content:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
