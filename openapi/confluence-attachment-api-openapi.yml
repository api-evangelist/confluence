openapi: 3.2.0
info:
  title: Confluence Attachment API
  version: 2.0.0
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  description: 'Operations tagged Attachment across 2 of this provider''s published API definitions: confluence-cloud-v2.yml, confluence-rest-v2-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{domain}.atlassian.net/wiki/api/v2
  description: Confluence Cloud
  variables:
    domain:
      default: your-domain
      description: Your Atlassian Cloud site domain
- url: https://{your-domain}/wiki/api/v2
  variables:
    your-domain:
      default: no-default
      description: Specific domain of the Confluence site being used. Must be provided.
tags:
- name: Attachment
  description: Manage file attachments on content
  externalDocs:
    url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-attachment/
paths:
  /attachments/{id}:
    get:
      operationId: getAttachmentById
      summary: Get Attachment by Id
      description: Returns a specific attachment by id.
      tags:
      - Attachment
      parameters:
      - $ref: '#/components/parameters/ContentIdPath'
      responses:
        '200':
          description: Returned if the attachment is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
              examples:
                Getattachmentbyid200Example:
                  summary: Default getAttachmentById 200 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    status: current
                    title: Example Title
                    mediaType: example_value
                    mediaTypeDescription: example_value
                    comment: example_value
                    fileSize: 10
                    webuiLink: example_value
                    downloadLink: example_value
                    pageId: '500123'
                    blogPostId: '500123'
                    version:
                      createdAt: '2026-01-15T10:30:00Z'
                      message: example_value
                      number: 10
                      minorEdit: true
                      authorId: '500123'
                    _links:
                      webui: example_value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oAuth2: []
      - bearerAuth: []
    delete:
      operationId: deleteAttachment
      summary: Delete Attachment
      description: Deletes an attachment by id.
      tags:
      - Attachment
      parameters:
      - $ref: '#/components/parameters/ContentIdPath'
      responses:
        '204':
          description: Returned if the attachment was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oAuth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/wiki/api/v2
      description: Confluence Cloud
      variables:
        domain:
          default: your-domain
          description: Your Atlassian Cloud site domain
  /pages/{id}/attachments:
    get:
      operationId: getPageAttachments
      summary: Get Attachments for Page
      description: Returns the attachments of a specific page.
      tags:
      - Attachment
      parameters:
      - $ref: '#/components/parameters/ContentIdPath'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Returned if the attachments are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentBulk'
              examples:
                Getpageattachments200Example:
                  summary: Default getPageAttachments 200 response
                  x-microcks-default: true
                  value:
                    results:
                    - id: abc123
                      status: current
                      title: Example Title
                      mediaType: example_value
                      mediaTypeDescription: example_value
                      comment: example_value
                      fileSize: 10
                      webuiLink: example_value
                      downloadLink: example_value
                      pageId: '500123'
                      blogPostId: '500123'
                    _links:
                      next: example_value
                      base: example_value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oAuth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/wiki/api/v2
      description: Confluence Cloud
      variables:
        domain:
          default: your-domain
          description: Your Atlassian Cloud site domain
  /attachments:
    get:
      tags:
      - Attachment
      operationId: getAttachments
      summary: Get attachments
      description: 'Returns all attachments. The number of results is limited by the `limit` parameter and additional results (if available)

        will be available through the `next` URL present in the `Link` response header.


        **Permissions required**:

        Permission to view the container of the attachment.'
      parameters:
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          $ref: '#/components/schemas/AttachmentSortOrder'
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set of results.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter the results to attachments based on their status. By default, `current` and `archived` are used.
        schema:
          type: array
          items:
            type: string
            enum:
            - current
            - archived
            - trashed
      - name: mediaType
        in: query
        required: false
        description: Filters on the mediaType of attachments. Only one may be specified.
        schema:
          type: string
      - name: filename
        in: query
        required: false
        description: Filters on the file-name of attachments. Only one may be specified.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of attachments per result to return. If more results exist, use the `Link` header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 50
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested attachments are returned.
          content:
            application/json:
              schema:
                title: MultiEntityResult<Attachment>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttachmentBulk_2'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: 'This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request''s URL. For example, rel="next" would be the URL necessary to get the next page of information.  Example response header format: `Link: </wiki/api/v2/attachments?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`

                '
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:attachment:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:attachment:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    servers:
    - url: https://{your-domain}/wiki/api/v2
      variables:
        your-domain:
          default: no-default
          description: Specific domain of the Confluence site being used. Must be provided.
  /blogposts/{id}/attachments:
    get:
      tags:
      - Attachment
      operationId: getBlogpostAttachments
      summary: Get attachments for blog post
      description: 'Returns the attachments of specific blog post. The number of results is limited by the `limit` parameter and additional results (if available)

        will be available through the `next` URL present in the `Link` response header.


        **Permissions required**:

        Permission to view the content of the blog post and its corresponding space.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the blog post for which attachments should be returned.
        schema:
          format: int64
          type: integer
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          $ref: '#/components/schemas/AttachmentSortOrder'
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set of results.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter the results to attachments based on their status. By default, `current` and `archived` are used.
        schema:
          type: array
          items:
            type: string
            enum:
            - current
            - archived
            - trashed
      - name: mediaType
        in: query
        required: false
        description: Filters on the mediaType of attachments. Only one may be specified.
        schema:
          type: string
      - name: filename
        in: query
        required: false
        description: Filters on the file-name of attachments. Only one may be specified.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of attachments per result to return. If more results exist, use the `Link` header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 50
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested attachments are returned.
          content:
            application/json:
              schema:
                title: MultiEntityResult<Attachment>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttachmentBulk_2'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: 'This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request''s URL. For example, rel="next" would be the URL necessary to get the next page of information. Example response header format: `Link: </wiki/api/v2/blogposts/<id>/attachments?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`

                '
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if the calling user does not have permission to view the

            requested blog post or the blog post was not found.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:attachment:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:attachment:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    servers:
    - url: https://{your-domain}/wiki/api/v2
      variables:
        your-domain:
          default: no-default
          description: Specific domain of the Confluence site being used. Must be provided.
  /custom-content/{id}/attachments:
    get:
      tags:
      - Attachment
      operationId: getCustomContentAttachments
      summary: Get attachments for custom content
      description: 'Returns the attachments of specific custom content. The number of results is limited by the `limit` parameter and additional results (if available)

        will be available through the `next` URL present in the `Link` response header.


        **Permissions required**:

        Permission to view the content of the custom content and its corresponding space.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the custom content for which attachments should be returned.
        schema:
          format: int64
          type: integer
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          $ref: '#/components/schemas/AttachmentSortOrder'
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set of results.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filter the results to attachments based on their status. By default, `current` and `archived` are used.
        schema:
          type: array
          items:
            type: string
            enum:
            - current
            - archived
            - trashed
      - name: mediaType
        in: query
        required: false
        description: Filters on the mediaType of attachments. Only one may be specified.
        schema:
          type: string
      - name: filename
        in: query
        required: false
        description: Filters on the file-name of attachments. Only one may be specified.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of attachments per result to return. If more results exist, use the `Link` header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 50
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested attachments are returned.
          content:
            application/json:
              schema:
                title: MultiEntityResult<Attachment>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttachmentBulk_2'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: 'This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request''s URL. For example, rel="next" would be the URL necessary to get the next page of information. Example response header format: `Link: </wiki/api/v2/custom-content/<id>/attachments?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`

                '
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if the calling user does not have permission to view the

            requested custom content or the custom content was not found.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:attachment:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:attachment:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    servers:
    - url: https://{your-domain}/wiki/api/v2
      variables:
        your-domain:
          default: no-default
          description: Specific domain of the Confluence site being used. Must be provided.
  /labels/{id}/attachments:
    get:
      tags:
      - Attachment
      operationId: getLabelAttachments
      summary: Get attachments for label
      description: 'Returns the attachments of specified label. The number of results is limited by the `limit` parameter and additional results (if available)

        will be available through the `next` URL present in the `Link` response header.


        **Permissions required**:

        Permission to view the attachment and its corresponding space.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the label for which attachments should be returned.
        schema:
          format: int64
          type: integer
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          $ref: '#/components/schemas/AttachmentSortOrder'
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set of results.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of pages per result to return. If more results exist, use the `Link` header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 25
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested attachments for specified label were successfully fetched.
          content:
            application/json:
              schema:
                title: MultiEntityResult<Attachment>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttachmentBulk_2'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: 'This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request''s URL. For example, rel="next" would be the URL necessary to get the next page of information. Example response header format: `Link: </wiki/api/v2/labels/<id>/attachment?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`

                '
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if the calling user does not have permission to view the

            requested label or label was not found.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:attachment:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:attachment:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    servers:
    - url: https://{your-domain}/wiki/api/v2
      variables:
        your-domain:
          default: no-default
          description: Specific domain of the Confluence site being used. Must be provided.
  /attachments/{id}/thumbnail/download:
    get:
      tags:
      - Attachment
      operationId: getAttachmentThumbnailById
      summary: Download attachment thumbnail by id
      description: 'Redirects the client to a URL that serves an attachment thumbnail''s binary data.


        **Permissions required**:

        Permission to view the attachment''s container.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the attachment to be returned. If you don't know the attachment's ID, use Get attachments for page/blogpost/custom content.
        schema:
          type: string
          pattern: (att)?[0-9]+
      - name: version
        in: query
        description: Allows you to retrieve a previously published version. Specify the previous version's number to retrieve its details.
        schema:
          type: integer
      - name: height
        in: query
        description: Allows you to define the thumbnail height.
        schema:
          type: integer
      - name: width
        in: query
        description: Allows you to define the thumbnail width.
        schema:
          type: integer
      responses:
        '302':
          description: Returned if download URL is found.
          content: {}
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if the calling user does not have permission to view the

            requested attachment or the attachment was not found.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:attachment:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:attachment:confluence
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
      x-atlassian-connect-scope: INACCESSIBLE
    servers:
    - url: https://{your-domain}/wiki/api/v2
      variables:
        your-domain:
          default: no-default
          description: Specific domain of the Confluence site being used. Must be provided.
components:
  schemas:
    Error:
      type: object
      description: Error response from the Confluence API.
      properties:
        statusCode:
          type: integer
          description: The HTTP status code.
          example: 10
        data:
          type: object
          properties:
            authorized:
              type: boolean
            valid:
              type: boolean
            errors:
              type: array
              items:
                type: object
                properties:
                  message:
                    type: object
                    properties:
                      key:
                        type: string
                      args:
                        type: array
                        items:
                          type: string
                      translation:
                        type: string
            successful:
              type: boolean
          description: Details about the error.
          example: example_value
        message:
          type: string
          description: A human-readable error message.
          example: example_value
    PaginationLinks:
      type: object
      description: Pagination links for cursor-based pagination.
      properties:
        next:
          type: string
          description: URL for the next page of results. Contains the cursor parameter.
          example: example_value
        base:
          type: string
          description: The base URL of the Confluence instance.
          example: example_value
    ContentLinks:
      type: object
      properties:
        webui:
          type: string
          description: Web UI link for the content.
          example: example_value
    Attachment:
      type: object
      description: Represents a file attachment on Confluence content.
      properties:
        id:
          type: string
          description: The unique identifier of the attachment.
          example: abc123
        status:
          type: string
          description: The status of the attachment.
          enum:
          - current
          - trashed
          example: current
        title:
          type: string
          description: The filename of the attachment.
          example: Example Title
        mediaType:
          type: string
          description: The MIME type of the attachment.
          example: example_value
        mediaTypeDescription:
          type: string
          description: Human-readable description of the media type.
          example: example_value
        comment:
          type: string
          description: Comment associated with the attachment upload.
          example: example_value
        fileSize:
          type: integer
          format: int64
          description: File size in bytes.
          example: 10
        webuiLink:
          type: string
          description: The web UI link for viewing the attachment.
          example: example_value
        downloadLink:
          type: string
          description: The download link for the attachment.
          example: example_value
        pageId:
          type: string
          description: The ID of the page this attachment belongs to.
          example: '500123'
        blogPostId:
          type: string
          description: The ID of the blog post this attachment belongs to.
          example: '500123'
        version:
          $ref: '#/components/schemas/Version'
        _links:
          $ref: '#/components/schemas/ContentLinks'
    AttachmentBulk:
      type: object
      description: A paginated list of attachments.
      properties:
        results:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
          example: []
        _links:
          $ref: '#/components/schemas/PaginationLinks'
    Version:
      type: object
      description: Version information for content.
      properties:
        createdAt:
          type: string
          format: date-time
          description: The ISO 8601 timestamp of this version.
          example: '2026-01-15T10:30:00Z'
        message:
          type: string
          description: The message associated with this version.
          example: example_value
        number:
          type: integer
          description: The version number.
          example: 10
        minorEdit:
          type: boolean
          description: Whether this was a minor edit.
          example: true
        authorId:
          type: string
          description: The Atlassian account ID of the version author.
          example: '500123'
    Label:
      type: object
      properties:
        id:
          type: string
          description: ID of the label.
        name:
          type: string
          description: Name of the label.
        prefix:
          type: string
          description: Prefix of the label.
    ContentStatus:
      enum:
      - current
      - draft
      - archived
      - historical
      - trashed
      - deleted
      - any
      type: string
      description: The status of the content.
    MultiEntityLinks:
      type: object
      properties:
        next:
          type: string
          description: 'Used for pagination. Contains the relative URL for the next set of results, using a cursor query parameter.

            This property will not be present if there is no additional data available.'
        base:
          type: string
          description: Base url of the Confluence site.
    AttachmentLinks:
      type: object
      properties:
        webui:
          type: string
          description: Web UI link of the content.
        download:
          type: string
          description: Download link of the content.
    AttachmentSingle:
      type: object
      properties:
        id:
          type: string
          description: ID of the attachment.
        status:
          $ref: '#/components/schemas/ContentStatus'
        title:
          type: string
          description: Title of the comment.
        createdAt:
          type: string
          format: date-time
          description: Date and time when the attachment was created. In format "YYYY-MM-DDTHH:mm:ss.sssZ".
        pageId:
          type: string
          description: 'ID of the containing page.


            Note: This is only returned if the attachment has a container that is a page.'
        blogPostId:
          type: string
          description: 'ID of the containing blog post.


            Note: This is only returned if the attachment has a container that is a blog post.'
        customContentId:
          type: string
          description: 'ID of the containing custom content.


