openapi: 3.2.0
info:
  title: Confluence Comment API
  version: 2.0.0
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  description: 'Operations tagged Comment across 2 of this provider''s published API definitions: confluence-cloud-v2.yml, confluence-rest-v2-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{domain}.atlassian.net/wiki/api/v2
  description: Confluence Cloud
  variables:
    domain:
      default: your-domain
      description: Your Atlassian Cloud site domain
- url: https://{your-domain}/wiki/api/v2
  variables:
    your-domain:
      default: no-default
      description: Specific domain of the Confluence site being used. Must be provided.
tags:
- name: Comment
  description: Create, retrieve, update, and delete comments on pages and blog posts
  externalDocs:
    url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-comment/
paths:
  /pages/{id}/footer-comments:
    get:
      operationId: getFooterComments
      summary: Get Footer Comments for Page
      description: Returns the footer comments of a specific page.
      tags:
      - Comment
      parameters:
      - $ref: '#/components/parameters/ContentIdPath'
      - $ref: '#/components/parameters/BodyFormatParam'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Returned if the footer comments are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentBulk'
              examples:
                Getfootercomments200Example:
                  summary: Default getFooterComments 200 response
                  x-microcks-default: true
                  value:
                    results:
                    - id: abc123
                      status: current
                      title: Example Title
                      blogPostId: '500123'
                      pageId: '500123'
                      parentCommentId: '500123'
                      authorId: '500123'
                      createdAt: '2026-01-15T10:30:00Z'
                      resolutionStatus: open
                    _links:
                      next: example_value
                      base: example_value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oAuth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/wiki/api/v2
      description: Confluence Cloud
      variables:
        domain:
          default: your-domain
          description: Your Atlassian Cloud site domain
