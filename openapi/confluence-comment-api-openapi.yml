      properties:
        representation:
          type: string
          description: The representation format of the body content.
          enum:
          - storage
          - atlas_doc_format
          - wiki
          - editor
          example: storage
        value:
          type: string
          description: The body content in the specified representation.
          example: example_value
    Like:
      type: object
      properties:
        accountId:
          type: string
          description: Account ID.
    FooterCommentModel:
