            - The calling user does not have permission to edit the specified blog post or the blog post was not found'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
