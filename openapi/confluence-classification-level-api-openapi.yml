openapi: 3.2.0
info:
  title: Confluence Cloud REST API v2 Classification Level API
  description: This document describes Confluence's v2 APIs. This is intended to be an iteration on the existing Confluence Cloud REST API with improvements in both endpoint definitions and performance.
  termsOfService: https://developer.atlassian.com/platform/marketplace/atlassian-developer-terms/
  version: 2.0.0
servers:
- url: https://{your-domain}/wiki/api/v2
  variables:
    your-domain:
      default: no-default
      description: Specific domain of the Confluence site being used. Must be provided.
tags:
- name: Classification Level
  description: ''
paths:
  /classification-levels:
    get:
      tags:
      - Classification Level
      operationId: getClassificationLevels
      summary: Get list of classification levels
      description: 'Returns a list of classification levels

        available.


        **Permissions required**:

        ''Permission to access the Confluence site (''Can use'' global permission).'
      responses:
        '200':
          description: Returned if classifications levels are returned.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ClassificationLevel'
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if:

            - Classification levels do not exist

            - Site''s edition does not have entitlement(s) for [data classification](https://support.atlassian.com/security-and-access-policies/docs/what-is-data-classification/)

            - The calling user does not have permissions to access the Confluence site

            '
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:configuration:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:configuration:confluence
      x-atlassian-connect-scope: READ
  /spaces/{id}/classification-level/default:
    get:
      tags:
      - Classification Level
      operationId: getSpaceDefaultClassificationLevel
      summary: Get space default classification level
      description: 'Returns the default classification level

        for a specific space.


        **Permissions required**:

        ''Permission to access the Confluence site (''Can use'' global permission) and permission to view the space.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the space for which default classification level should be returned.
        schema:
          format: int64
          type: integer
      responses:
        '200':
          description: Returned if the requested default classification level for a space is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationLevel'
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if:

            - Default classification level is not applied to the space

            - Site''s edition does not have entitlement(s) for [data classification](https://support.atlassian.com/security-and-access-policies/docs/what-is-data-classification/)

            - The calling user does not have permission to view the specified space or the space was not found'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:space:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:space:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    put:
      tags:
      - Classification Level
      operationId: putSpaceDefaultClassificationLevel
      summary: Update space default classification level
      description: 'Update the default classification level

        for a specific space.


        **Permissions required**:

        ''Permission to access the Confluence site (''Can use'' global permission) and ''Admin'' permission for the space.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the space for which default classification level should be updated.
        schema:
          format: int64
          type: integer
      requestBody:
        $ref: '#/components/requestBodies/SpaceDefaultClassificationLevelUpdateRequest'
      responses:
        '204':
          description: Returned if the default classification level was successfully updated.
          content: {}
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if:

            - Site''s edition does not have entitlement(s) for [data classification](https://support.atlassian.com/security-and-access-policies/docs/what-is-data-classification/)

            - The calling user does not have permission to view the specified space or the space was not found'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:space:confluence
        - write:space:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:space:confluence
        - write:space:confluence
      x-atlassian-connect-scope: WRITE
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    delete:
      tags:
      - Classification Level
      operationId: deleteSpaceDefaultClassificationLevel
      summary: Delete space default classification level
      description: 'Returns the default classification level

        for a specific space.


        **Permissions required**:

        ''Permission to access the Confluence site (''Can use'' global permission) and ''Admin'' permission for the space.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the space for which default classification level should be deleted.
        schema:
          format: int64
          type: integer
      responses:
        '204':
          description: Returned if the default classification level was successfully deleted.
          content: {}
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if:

            - Site''s edition does not have entitlement(s) for [data classification](https://support.atlassian.com/security-and-access-policies/docs/what-is-data-classification/)

            - The calling user does not have permission to view the specified space or the space was not found'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:space:confluence
        - write:space:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:space:confluence
        - write:space:confluence
      x-atlassian-connect-scope: WRITE
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
  /pages/{id}/classification-level:
    get:
      tags:
      - Classification Level
      operationId: getPageClassificationLevel
      summary: Get page classification level
      description: 'Returns the classification level

        for a specific page.


        **Permissions required**:

        ''Permission to access the Confluence site (''Can use'' global permission) and permission to view the page.

        ''Permission to edit the page is required if trying to view classification level for a draft.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the page for which classification level should be returned.
        schema:
          format: int64
          type: integer
      - name: status
        in: query
        required: false
        description: Status of page from which classification level will fetched.
        schema:
          type: string
          default: current
          enum:
          - current
          - draft
          - archived
      responses:
        '200':
          description: Returned if the requested classification level for a page is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationLevel'
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if:

            - Page does not have a classification level applied

            - Site''s edition does not have entitlement(s) for [data classification](https://support.atlassian.com/security-and-access-policies/docs/what-is-data-classification/)

            - The calling user does not have permission to view the specified page or the page was not found

            - The calling user does not have permission to edit the specified page when trying to fetch classification level for a draft'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:page:confluence
        - write:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:page:confluence
        - write:page:confluence
      x-atlassian-connect-scope: WRITE
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    put:
      tags:
      - Classification Level
      operationId: putPageClassificationLevel
      summary: Update page classification level
      description: 'Updates the classification level

        for a specific page.


        **Permissions required**:

        ''Permission to access the Confluence site (''Can use'' global permission) and permission to edit the page.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the page for which classification level should be updated.
        schema:
          format: int64
          type: integer
      requestBody:
        $ref: '#/components/requestBodies/ContentClassificationLevelUpdateRequest'
      responses:
        '204':
          description: Returned if the classification level was successfully updated.
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if:

            - Site''s edition does not have entitlement(s) for [data classification](https://support.atlassian.com/security-and-access-policies/docs/what-is-data-classification/)

            - The calling user does not have permission to edit the specified page or the page was not found'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - write:page:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - write:page:confluence
      x-atlassian-connect-scope: WRITE
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
  /pages/{id}/classification-level/reset:
    post:
      tags:
      - Classification Level
      operationId: postPageClassificationLevel
      summary: Reset page classification level
      description: 'Resets the classification level

        for a specific page for the space

