openapi: 3.2.0
info:
  title: Confluence Label API
  version: 2.0.0
  x-refined-note:
  - x-logo differs across the merged source definitions and was not carried
  description: 'Operations tagged Label across 2 of this provider''s published API definitions: confluence-cloud-v2.yml, confluence-rest-v2-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{domain}.atlassian.net/wiki/api/v2
  description: Confluence Cloud
  variables:
    domain:
      default: your-domain
      description: Your Atlassian Cloud site domain
- url: https://{your-domain}/wiki/api/v2
  variables:
    your-domain:
      default: no-default
      description: Specific domain of the Confluence site being used. Must be provided.
tags:
- name: Label
  description: Manage labels on content
  externalDocs:
    url: https://developer.atlassian.com/cloud/confluence/rest/v2/api-group-label/
paths:
  /pages/{id}/labels:
    get:
      operationId: getPageLabels
      summary: Get Labels for Page
      description: Returns the labels associated with a specific page.
      tags:
      - Label
      parameters:
      - $ref: '#/components/parameters/ContentIdPath'
      - $ref: '#/components/parameters/LabelPrefixParam'
      - $ref: '#/components/parameters/CursorParam'
      - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Returned if the labels are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LabelArray'
              examples:
                Getpagelabels200Example:
                  summary: Default getPageLabels 200 response
                  x-microcks-default: true
                  value:
                    results:
                    - id: abc123
                      name: Example Title
                      prefix: example_value
                    _links:
                      next: example_value
                      base: example_value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oAuth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/wiki/api/v2
      description: Confluence Cloud
      variables:
        domain:
          default: your-domain
          description: Your Atlassian Cloud site domain
  /labels/{id}:
    get:
      operationId: getLabelById
      summary: Get Label by Id
      description: Returns a specific label by id.
      tags:
      - Label
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the label.
        schema:
          type: integer
          format: int64
        example: abc123
      responses:
        '200':
          description: Returned if the label is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Label'
              examples:
                Getlabelbyid200Example:
                  summary: Default getLabelById 200 response
                  x-microcks-default: true
                  value:
                    id: abc123
                    name: Example Title
                    prefix: example_value
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
      security:
      - basicAuth: []
      - oAuth2: []
      - bearerAuth: []
    servers:
    - url: https://{domain}.atlassian.net/wiki/api/v2
      description: Confluence Cloud
      variables:
        domain:
          default: your-domain
          description: Your Atlassian Cloud site domain
  /attachments/{id}/labels:
    get:
      tags:
      - Label
      operationId: getAttachmentLabels
      summary: Get labels for attachment
      description: 'Returns the labels of specific attachment. The number of results is limited by the `limit` parameter and additional results (if available)

        will be available through the `next` URL present in the `Link` response header.


        **Permissions required**:

        Permission to view the parent content of the attachment and its corresponding space.

        Only labels that the user has permission to view will be returned.'
      parameters:
      - name: id
        in: path
        required: true
        description: The ID of the attachment for which labels should be returned.
        schema:
          format: int64
          type: integer
      - name: prefix
        in: query
        required: false
        description: Filter the results to labels based on their prefix.
        schema:
          type: string
          enum:
          - my
          - team
          - global
          - system
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          type: string
          items:
            $ref: '#/components/schemas/LabelSortOrder'
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set of results.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of labels per result to return. If more results exist, use the `Link` header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 25
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested labels are returned.
          content:
            application/json:
              schema:
                title: MultiEntityResult<Label>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/Label_2'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: 'This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request''s URL. For example, rel="next" would be the URL necessary to get the next page of information. Example response header format: `Link: </wiki/api/v2/attachments/<id>/labels?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`

                '
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if the calling user does not have permission to view the

            parent content of the requested attachment or the attachment was not found.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:attachment:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:attachment:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    servers:
    - url: https://{your-domain}/wiki/api/v2
      variables:
        your-domain:
          default: no-default
          description: Specific domain of the Confluence site being used. Must be provided.
