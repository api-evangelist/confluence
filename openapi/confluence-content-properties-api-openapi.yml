      operationId: updateAttachmentPropertyById
      summary: Update content property for attachment by id
      description: 'Update a content property for attachment by its id.


        **Permissions required**:

        Permission to edit the attachment.'
      parameters:
      - name: attachment-id
        in: path
        required: true
        description: The ID of the attachment the property belongs to.
        schema:
          type: string
          pattern: (att)?[0-9]+
      - name: property-id
        in: path
        required: true
        description: The ID of the property to be updated.
        schema:
          format: int64
          type: integer
      requestBody:
        description: The content property to be updated.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentPropertyUpdateRequest'
        required: true
      responses:
        '200':
          description: Returned if the content property was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentProperty'
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if the calling user does not have permission to view the

            specified attachment or the attachment was not found.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:attachment:confluence
        - write:attachment:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:attachment:confluence
        - write:attachment:confluence
      x-atlassian-connect-scope: WRITE
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    delete:
      tags:
      - Content Properties
      operationId: deleteAttachmentPropertyById
      summary: Delete content property for attachment by id
      description: 'Deletes a content property for an attachment by its id.


        **Permissions required**:

        Permission to attachment the page.'
      parameters:
      - name: attachment-id
        in: path
        required: true
        description: The ID of the attachment the property belongs to.
        schema:
          type: string
          pattern: (att)?[0-9]+
      - name: property-id
        in: path
        required: true
        description: The ID of the property to be deleted.
        schema:
          format: int64
          type: integer
      responses:
        '204':
          description: Returned if the content property was deleted successfully.
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if the calling user does not have permission to view the

            specified attachment or the attachment was not found.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:attachment:confluence
        - write:attachment:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
