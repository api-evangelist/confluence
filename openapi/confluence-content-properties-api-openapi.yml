openapi: 3.2.0
info:
  title: Confluence Cloud REST API v2 Content Properties API
  description: This document describes Confluence's v2 APIs. This is intended to be an iteration on the existing Confluence Cloud REST API with improvements in both endpoint definitions and performance.
  termsOfService: https://developer.atlassian.com/platform/marketplace/atlassian-developer-terms/
  version: 2.0.0
servers:
- url: https://{your-domain}/wiki/api/v2
  variables:
    your-domain:
      default: no-default
      description: Specific domain of the Confluence site being used. Must be provided.
tags:
- name: Content Properties
  description: ''
paths:
  /attachments/{attachment-id}/properties:
    get:
      tags:
      - Content Properties
      operationId: getAttachmentContentProperties
      summary: Get content properties for attachment
      description: 'Retrieves all Content Properties tied to a specified attachment.


        **Permissions required**:

        Permission to view the attachment.'
      parameters:
      - name: attachment-id
        in: path
        required: true
        description: The ID of the attachment for which content properties should be returned.
        schema:
          type: string
          pattern: (att)?[0-9]+
      - name: key
        in: query
        required: false
        description: Filters the response to return a specific content property with matching key (case sensitive).
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Used to sort the result by a particular field.
        schema:
          $ref: '#/components/schemas/ContentPropertySortOrder'
      - name: cursor
        in: query
        required: false
        description: Used for pagination, this opaque cursor will be returned in the `next` URL in the `Link` response header. Use the relative URL in the `Link` header to retrieve the `next` set of results.
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of attachments per result to return. If more results exist, use the `Link` header to retrieve a relative URL that will return the next set of results.
        schema:
          format: int32
          default: 25
          minimum: 1
          maximum: 250
          type: integer
      responses:
        '200':
          description: Returned if the requested content properties are successfully retrieved.
          content:
            application/json:
              schema:
                title: MultiEntityResult<ContentProperty>
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/ContentProperty'
                  _links:
                    $ref: '#/components/schemas/MultiEntityLinks'
          headers:
            Link:
              schema:
                type: string
              description: 'This header contains URL(s) within angle brackets and a relation description for each URL, describing how the provided URL relates to the incoming request''s URL. For example, rel="next" would be the URL necessary to get the next page of information. Example response header format: `Link: </wiki/api/v2/attachments/<attachment-id>/properties?cursor=<opaque cursor token>>; rel="next", <https://site.atlassian.net/wiki>; rel="base"`

                '
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if the calling user does not have permission to view the

            specified attachment or the attachment was not found.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:attachment:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:attachment:confluence
      x-atlassian-connect-scope: READ
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
    post:
      tags:
      - Content Properties
      operationId: createAttachmentProperty
      summary: Create content property for attachment
      description: 'Creates a new content property for an attachment.


        **Permissions required**:

        Permission to update the attachment.'
      parameters:
      - name: attachment-id
        in: path
        required: true
        description: The ID of the attachment to create a property for.
        schema:
          type: string
          pattern: (att)?[0-9]+
      requestBody:
        description: The content property to be created
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContentPropertyCreateRequest'
        required: true
      responses:
        '200':
          description: Returned if the content property was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentProperty'
        '400':
          description: Returned if an invalid request is provided.
          content: {}
        '401':
          description: 'Returned if the authentication credentials are incorrect or missing

            from the request.'
          content: {}
        '404':
          description: 'Returned if the calling user does not have permission to view the

            specified attachment or the attachment was not found.'
          content: {}
      security:
      - basicAuth: []
      - oAuthDefinitions:
        - read:attachment:confluence
        - write:attachment:confluence
      x-atlassian-oauth2-scopes:
      - scheme: oAuthDefinitions
        state: Current
        scopes:
        - read:attachment:confluence
        - write:attachment:confluence
      x-atlassian-connect-scope: WRITE
      x-atlassian-data-security-policy:
      - app-access-rule-exempt: false
  /attachments/{attachment-id}/properties/{property-id}:
    get:
